<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Helpdesk Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-container">

    <!-- Mobile Menu Button -->
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2>🎓 College ChatBot</h2>
        <p>AI Helpdesk System</p>
        <hr>
        <ul>
            <li>📌 Admission Info</li>
            <li>💰 Fees Details</li>
            <li>📅 Timetable</li>
            <li>📞 Contact Support</li>
        </ul>
    </div>

    <!-- Chat Section -->
    <div class="chat-container">

        <div class="chat-header">
            <span>College Helpdesk Chatbot</span>
            <button onclick="window.location.href='/admin'" class="admin-btn">Admin Panel</button>
            <button id="themeToggle">🌙</button>
        </div>

        <div id="chat" class="chat-box"></div>

        <div class="chat-input">
            <input type="text" id="msg" placeholder="Ask your question..." autofocus>
            <button onclick="send()">➤</button>
            <button onclick="window.speechSynthesis.cancel()">🔇</button>
        </div>

    </div>

</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("show");
}

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function send() {
    let input = document.getElementById("msg");
    let message = input.value.trim();
    if (message === "") return;

    addMessage("user", message);

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: message})
    })
    .then(res => res.json())
    .then(data => {
        addMessage("bot", data.reply);
        speak(data.reply);
    });

    input.value = "";
}

function addMessage(sender, text) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message " + sender;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("msg").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        send();
    }
});

const toggleBtn = document.getElementById("themeToggle");
const body = document.body;

if (localStorage.getItem("theme") === "light") {
    body.classList.add("light");
    toggleBtn.textContent = "☀️";
}

toggleBtn.onclick = () => {
    body.classList.toggle("light");
    const isLight = body.classList.contains("light");
    toggleBtn.textContent = isLight ? "☀️" : "🌙";
    localStorage.setItem("theme", isLight ? "light" : "dark");
};
</script>

</body>
</html>
