<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Helpdesk Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-container">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2>🎓 College ChatBot</h2>
        <p>AI Helpdesk System</p>
        <hr>
        <ul>
            <li>📌 Admission Info</li>
            <li>💰 Fees Details</li>
            <li>📅 Timetable</li>
            <li>📞 Contact Support</li>
        </ul>
    </div>

    <!-- Chat Section -->
    <div class="chat-container">

        <div class="chat-header">
            <span>College Helpdesk Chatbot</span>
            <div class="header-buttons">
                <button id="themeToggle">🌙</button>
                <button onclick="toggleVoice()">🎤</button>
            </div>
        </div>

        <div id="chat" class="chat-box"></div>

        <div class="chat-input">
            <input type="text" id="msg" placeholder="Ask your question..." autofocus>
            <button onclick="send()">➤</button>
        </div>

    </div>

</div>

<script>
let voiceEnabled = true;

// Voice Reply
function speak(text) {
    if (!voiceEnabled) return;
    if (!('speechSynthesis' in window)) return;

    let speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-IN";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    alert("Voice " + (voiceEnabled ? "ON" : "OFF"));
}

// Send Message (Demo bot reply)
function send() {
    let input = document.getElementById("msg");
    let message = input.value.trim();
    if (!message) return;

    addMessage("user", message);

    // Demo bot reply (replace with backend later)
    let reply = "Thanks for your question. Our team will help you soon.";

    setTimeout(() => {
        addMessage("bot", reply);
        speak(reply);
    }, 500);

    input.value = "";
}

function addMessage(sender, text) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "message " + sender;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// Enter key support
document.getElementById("msg").addEventListener("keydown", function(e) {
    if (e.key === "Enter") send();
});

// Theme Toggle
const toggleBtn = document.getElementById("themeToggle");
const body = document.body;

if (localStorage.getItem("theme") === "light") {
    body.classList.add("light");
    toggleBtn.textContent = "☀️";
}

toggleBtn.onclick = () => {
    body.classList.toggle("light");
    const isLight = body.classList.contains("light");
    toggleBtn.textContent = isLight ? "☀️" : "🌙";
    localStorage.setItem("theme", isLight ? "light" : "dark");
};
</script>

</body>
</html>
