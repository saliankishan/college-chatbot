<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Chatbot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="app">

<div class="sidebar" id="sidebar">
    <h2>🎓 College Chatbot</h2>
    <p>AI Helpdesk System</p>
    <ul>
        <li>📌 Admissions</li>
        <li>💰 Fees</li>
        <li>📅 Timetable</li>
        <li>📞 Contact</li>
    </ul>
</div>

<div class="chat">

<div class="chat-header">
    <span>College Helpdesk AI 🤖</span>
    <div class="header-actions">
        <button class="btn" onclick="location.href='/admin'">Admin</button>
        <button class="btn" id="themeToggle">🌙</button>
    </div>
</div>

<div id="chat" class="chat-box"></div>

<div class="chat-input">
    <input type="text" id="msg" placeholder="Type your question...">
    <button onclick="send()">➤</button>
</div>

</div>
</div>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("show");
}

function send() {
    let input = document.getElementById("msg");
    let message = input.value.trim();
    if (!message) return;

    addMessage("user", message);

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
    })
    .then(res => res.json())
    .then(data => addMessage("bot", data.reply));

    input.value = "";
}

function addMessage(type, text) {
    let chat = document.getElementById("chat");
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
