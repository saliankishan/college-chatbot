<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - College Chatbot</title>

<style>
* {
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top left, #0f172a, #020617);
    color: white;
    overflow: hidden;
}

/* ===== Animated Background Glow ===== */
.bg-glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #2563eb, transparent 70%);
    filter: blur(80px);
    animation: float 8s infinite alternate;
    opacity: 0.6;
}

.bg-glow2 {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, #a855f7, transparent 70%);
    filter: blur(90px);
    animation: float2 10s infinite alternate;
    opacity: 0.5;
}

@keyframes float {
    from { transform: translate(-150px, -100px); }
    to { transform: translate(150px, 100px); }
}

@keyframes float2 {
    from { transform: translate(200px, -150px); }
    to { transform: translate(-200px, 150px); }
}

/* ===== Glass Login Box ===== */
.login-box {
    width: 380px;
    padding: 28px 26px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 0 25px rgba(37, 99, 235, 0.25);
    position: relative;
    z-index: 2;
    animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
}

/* ===== AI Avatar ===== */
.ai-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #2563eb, #a855f7);
    box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
    animation: pulse 2s infinite;
    font-size: 30px;
}

@keyframes pulse {
    0% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }
    50% { box-shadow: 0 0 30px rgba(37, 99, 235, 1); }
    100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); }
}

/* ===== Back Button ===== */
.back-btn {
    display: inline-block;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    padding: 6px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: 0.2s;
    margin-bottom: 12px;
}

.back-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.7);
}

/* ===== Title ===== */
.login-box h2 {
    text-align: center;
    margin: 6px 0 16px;
    font-size: 22px;
    color: #38bdf8;
    text-shadow: 0 0 10px #38bdf8;
}

/* ===== Typing AI Text ===== */
.ai-text {
    text-align: center;
    font-size: 13px;
    color: #a5b4fc;
    margin-bottom: 12px;
    height: 18px;
}

/* ===== Inputs ===== */
.login-box input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
    transition: 0.2s;
}

.login-box input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
}

/* ===== Login Button ===== */
.login-box button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    background: linear-gradient(135deg, #2563eb, #a855f7);
    color: white;
    box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
    transition: 0.25s;
}

.login-box button:hover {
    transform: scale(1.03);
    box-shadow: 0 0 22px rgba(168, 85, 247, 0.8);
}

/* Error */
.error {
    margin-top: 10px;
    text-align: center;
    color: #f87171;
    font-size: 13px;
}

/* Footer */
.footer-text {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    opacity: 0.6;
}

/* Responsive */
@media (max-width: 480px) {
    .login-box {
        width: 90%;
        padding: 22px;
    }
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="login-box">

    <a href="/" class="back-btn">⬅ Back to Chatbot</a>

    <div class="ai-avatar">👤</div>

    <h2>Admin Login</h2>

    <div class="ai-text" id="aiText"></div>

    <form method="post">
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <div class="footer-text">
        College Helpdesk AI System
    </div>

</div>

<script>
/* Typing AI text animation */
const text = "Initializing secure AI authentication...";
let index = 0;
function typeEffect() {
    if (index < text.length) {
        document.getElementById("aiText").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeEffect, 40);
    }
}
typeEffect();
</script>

</body>
</html>
